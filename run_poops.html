<!DOCTYPE html>
<html lang="ar" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BALLO - Poops Exploit</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Black+Ops+One&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">

<style>
  :root { --ballo-violet: #b700ff; --ballo-yellow: #e5ff00; --dark-bg: rgba(15, 10, 20, 0.92); }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    min-height: 100vh; background: #0a050f; color: #fff;
    font-family: 'Cairo', sans-serif; display: flex; align-items: center; justify-content: center; direction: rtl; overflow: hidden;
  }
  body::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, rgba(183, 0, 255, 0.15) 0%, rgba(10,5,15,1) 100%); z-index: 0; }

  .hud-container {
    position: relative; z-index: 1; width: 95%; max-width: 850px; background: var(--dark-bg);
    border: 2px solid #222; border-top: 5px solid var(--ballo-yellow); border-bottom: 5px solid var(--ballo-yellow);
    border-radius: 15px; padding: 40px 30px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9), inset 0 0 30px rgba(183, 0, 255, 0.1);
  }

  .brand-title { font-family: 'Black Ops One', 'Orbitron', cursive; font-size: 4rem; text-align: center; color: #fff; letter-spacing: 5px; margin-bottom: 0px; text-transform: uppercase; direction: ltr; text-shadow: 3px 3px 0px #000, -2px -2px 0px var(--ballo-violet), 2px 2px 0px var(--ballo-yellow); }
  .brand-title span { color: var(--ballo-yellow); }
  .brand-ar { font-size: 1.5rem; text-align: center; color: var(--ballo-violet); font-weight: 900; letter-spacing: 2px; margin-bottom: 5px; text-shadow: 0 0 15px rgba(183, 0, 255, 0.6); }
  
  .brand-sub { font-size: 1.2rem; text-align: center; color: #ccc; font-weight: 900; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 25px; direction: ltr; }

  .status-panel { background: rgba(0, 0, 0, 0.8); padding: 20px; border-radius: 8px; border: 1px dashed rgba(183, 0, 255, 0.5); margin-bottom: 15px; position: relative; box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.9); }
  .status-panel::before { content: 'EXECUTION'; position: absolute; top: -12px; right: 20px; background: var(--ballo-violet); color: #fff; padding: 2px 12px; font-family: 'Orbitron', sans-serif; font-size: 12px; font-weight: bold; border-radius: 3px; box-shadow: 0 0 10px rgba(183, 0, 255, 0.5); }

  #state { font-size: 24px; font-weight: 900; color: #fff; text-shadow: 0 0 10px rgba(229, 255, 0, 0.6); text-align: center; margin-bottom: 10px; }
  
  .loader-wrapper { display: flex; justify-content: center; gap: 8px; margin-top: 10px; }
  .dot { width: 12px; height: 12px; background: #fff; border-radius: 50%; box-shadow: 0 0 10px #fff; animation: bounce 1s infinite alternate; }
  .dot:nth-child(2) { animation-delay: 0.2s; background: var(--ballo-violet); box-shadow: 0 0 10px var(--ballo-violet); } .dot:nth-child(3) { animation-delay: 0.4s; background: var(--ballo-yellow); box-shadow: 0 0 10px var(--ballo-yellow); }
  @keyframes bounce { to { transform: translateY(-10px); opacity: 0.5; } }

  #out-container { position: absolute; width: 1px; height: 1px; overflow: hidden; opacity: 0; pointer-events: none; }
  #out { white-space: pre-wrap; font: 12px/1.45 Consolas, monospace; background: rgba(0, 0, 0, 0.85); border: 1px solid rgba(183, 0, 255, 0.3); border-radius: 8px; padding: 14px; max-height: 250px; overflow-y: auto; color: #c8ced8; direction: ltr; text-align: left; }

  .done { color: #00ff88 !important; text-shadow: 0 0 10px #00ff88 !important; }
  .error { color: #ff3333 !important; text-shadow: 0 0 10px #ff3333 !important; }
  
  .powered-by { position: fixed; bottom: 12px; right: 20px; font-family: 'Orbitron', sans-serif; font-size: 13px; letter-spacing: 2px; color: rgba(255, 255, 255, 0.3); z-index: 10; direction: ltr; }
  .powered-by span { color: var(--ballo-yellow); font-weight: 900; text-shadow: 0 0 8px var(--ballo-yellow); }
  .footer-sys { position: fixed; bottom: 12px; left: 20px; font-family: 'Orbitron', sans-serif; font-size: 11px; color: rgba(255,255,255,0.2); letter-spacing: 2px; z-index: 10; direction: ltr; }

  @media (max-width: 600px) { .brand-title { font-size: 3rem; } .brand-ar { font-size: 1.2rem; } .hud-container { padding: 30px 15px; } .powered-by { font-size: 10px; right: 10px; } .footer-sys { font-size: 9px; left: 10px; } }
</style>
</head>
<body>

<div class="hud-container">
  <h1 class="brand-title">BALLO</h1>
  <div class="brand-ar">باللو</div>
  <div class="brand-sub">POOPS EXPLOIT</div>

  <div class="status-panel">
    <div id="state">
      <span id="stateText">جارٍ تحميل سلسلة Poops<br><small>Please Wait...</small></span>
      <div class="loader-wrapper">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      </div>
    </div>
  </div>
  
  <div id="out-container"><div id="out"></div></div>
</div>

<div class="powered-by">POWERED BY <span>MAHMOUD FATHY</span></div>
<div class="footer-sys">BALLO OS v1.0 - Poops</div>

<script type="module">
import "./chain_poops.js";

const state = document.getElementById("state");
const stateText = document.getElementById("stateText");

window.poopsDone = function () {
  state.classList.add("done");
  stateText.innerHTML = "اكتملت العملية بنجاح<br><small>EXPLOIT SUCCESSFUL</small>";
  document.querySelector('.loader-wrapper').style.display = 'none';
};

window.poopsError = function () {
  state.classList.add("error");
  stateText.innerHTML = "حدث خطأ أثناء التنفيذ<br><small>EXPLOIT FAILED</small>";
  document.querySelector('.loader-wrapper').style.display = 'none';
};
</script>
</body>
</html>
